  home_greeting: Ciao! Sono Tomohiro Yoshida, astronomo e ricercatore postdoc presso l’[Università degli Studi di
    Milano](https://www.unimi.it/it), in Italia.
  home_research: Per capire quando, dove e come si sono formati il Sistema solare e gli altri sistemi planetari,
    studio attraverso le osservazioni i **dischi protoplanetari**, i luoghi in cui nascono i pianeti.
  interests:
  - 'Struttura fisica e chimica dei dischi protoplanetari: quali materiali contengono, dove si trovano, in quali
    quantità e quali processi fisici vi avvengono?'
  - Chimica isotopica nelle regioni di formazione stellare e planetaria, per ricostruire l’origine e l’evoluzione
    della materia
